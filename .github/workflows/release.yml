name: Release

# Publishes to crates.io when a v* tag is pushed, e.g. `git tag v0.1.0 && git push --tags`.
# Requires the CARGO_REGISTRY_TOKEN repo secret (crates.io API token).
on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libusb (rusb link dep)
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Verify tag matches Cargo.toml version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate="$(cargo metadata --no-deps --format-version 1 | grep -oP '"version":"\K[^"]+' | head -1)"
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag v$tag != Cargo.toml version $crate"; exit 1
          fi

      - name: Publish dry-run
        run: cargo publish --locked --dry-run

      - name: Publish to crates.io
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
